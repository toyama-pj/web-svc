readme = "README.md"
authors = [
    { name = "m-tsuru", email = "147146974+m-tsuru@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django==6.1.3",
    "django-allauth[mfa]==65.22.1",
    "psycopg[binary]>=3.2,<4",
]

