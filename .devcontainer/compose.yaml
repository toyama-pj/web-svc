services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    working_dir: /workspaces/web-svc
    volumes:
      - ..:/workspaces/web-svc
      - python-venv:/workspaces/web-svc/.venv
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: web-db
      POSTGRES_USER: db
      POSTGRES_PASSWORD: agrinet
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db -d web-db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  python-venv:
